<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <title>DuckDrop</title>

    <style>
        :root {
            --bg: #202124;
            --surface: #292A2D;
            --surface-2: #35363A;
            --border: #3C4043;
            --text: #E8EAED;
            --text-secondary: #9AA0A6;
            --accent: #FBBC04;
            --accent-hover: #F9AB00;
            --accent-ink: #202124;
            --success: #81C995;
            --danger: #F28B82;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Roboto', Arial, sans-serif;

            display: flex;
            justify-content: center;
        }

        .layout {
            width: 100%;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 90px 20px 40px;
            text-align: center;
            position: relative;
        }

        h1 {
            margin-bottom: 35px;
            font-size: 40px;
            font-weight: 500;
        }

        /* ===================== ONLINE SIDEBAR ===================== */

        .online-sidebar {
            position: fixed;
            top: 100px;
            left: 25px;
            width: 220px;
            z-index: 50;
        }

        .online-sidebar h3 {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin: 0 0 14px;
        }

        .online-user-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: .15s;
        }

        .online-user-card:hover {
            background: var(--surface-2);
            box-shadow: 0 1px 3px rgba(0,0,0,.4);
        }

        .online-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--accent-ink);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            font-size: 14px;
            flex-shrink: 0;
        }

        .online-user-card .name {
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .online-empty {
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* ===================== TURNSTILE ГЕЙТ ===================== */

        #turnstileOverlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 500;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 22px;
        }

        #turnstileOverlay.hidden {
            display: none;
        }

        #turnstileOverlay h2 {
            font-size: 22px;
            font-weight: 500;
            margin: 0;
        }

        #turnstileOverlay p {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0;
        }

        #turnstileError {
            color: var(--danger);
            font-size: 13px;
            min-height: 16px;
        }

        #goOfflineLink {
            position: fixed;
            top: 24px;
            left: 25px;
            z-index: 100;
            color: var(--text-secondary);
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
        }

        #goOfflineLink:hover {
            color: var(--text);
        }

        /* ===================== AUTH UI ===================== */

        .auth-bar {
            position: fixed;
            top: 20px;
            right: 25px;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 100;
        }

        .auth-bar button {
            margin: 0;
            padding: 10px 20px;
            font-size: 14px;
        }

        .btn-secondary {
            background: transparent !important;
            color: var(--text) !important;
            border: 1px solid var(--border) !important;
            box-shadow: none !important;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,.06) !important;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }

        .user-chip:hover {
            background: var(--surface-2);
        }

        .user-chip .balance {
            color: var(--success);
            font-weight: 500;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.6);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            width: 340px;
            max-width: 90%;
            text-align: left;
            position: relative;
            box-shadow: 0 8px 28px rgba(0,0,0,.45);
        }

        .modal.wide {
            width: 560px;
        }

        .modal h2 {
            margin: 0 0 20px;
            font-size: 20px;
            font-weight: 500;
        }

        .modal label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin: 14px 0 6px;
        }

        .modal input, .modal textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
        }

        .modal input:focus, .modal textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(251,188,4,.25);
        }

        .modal .modal-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 22px;
        }

        .modal .modal-actions button {
            margin: 0;
            padding: 10px 22px;
            font-size: 14px;
        }

        .modal .switch-link {
            background: none;
            color: var(--text-secondary);
            border: none;
            font-size: 13px;
            padding: 0;
            text-decoration: underline;
            cursor: pointer;
        }

        .modal .close-x {
            position: absolute;
            top: 14px;
            right: 16px;
            background: none;
            color: var(--text-secondary);
            border: none;
            font-size: 20px;
            padding: 4px 8px;
            margin: 0;
        }

        .auth-error {
            color: var(--danger);
            font-size: 13px;
            margin-top: 12px;
            min-height: 16px;
        }

        /* ===================== ПРОФИЛЬ ===================== */

        .profile-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 8px;
        }

        .profile-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--accent-ink);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            font-size: 22px;
            flex-shrink: 0;
        }

        .profile-name-row {
            display: flex;
            flex-direction: column;
        }

        .profile-name-row .pname {
            font-size: 18px;
            font-weight: 500;
        }

        .profile-name-row .pbalance {
            color: var(--success);
            font-size: 13px;
        }

        .profile-description-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 14px 0 4px;
        }

        .profile-description-text {
            font-size: 13px;
            color: var(--text-secondary);
            flex: 1;
            min-height: 20px;
            white-space: pre-wrap;
        }

        .edit-pencil {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 15px;
            padding: 2px 4px;
            margin: 0;
        }

        .edit-pencil:hover {
            color: var(--accent);
        }

        .profile-description-edit textarea {
            min-height: 70px;
        }

        .profile-description-edit .modal-actions {
            margin-top: 10px;
        }

        .inventory-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin: 18px 0 10px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-height: 320px;
            overflow-y: auto;
        }

        .inventory-slot {
            aspect-ratio: 1;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 4px;
            cursor: default;
        }

        .inventory-slot.filled {
            cursor: pointer;
        }

        .inventory-slot img {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }

        .inventory-slot .slot-name {
            font-size: 9px;
            color: var(--text-secondary);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .inventory-slot .remove-x {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* ===================== РЕЗУЛЬТАТ ПРОКРУТА ===================== */

        .result-slot {
            display: none;
            margin-top: 25px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        .result-slot.visible {
            display: flex;
        }

        .result-slot .result-info {
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
        }

        .result-slot img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .result-slot .result-name {
            font-weight: 500;
            font-size: 16px;
        }

        .result-slot .result-price {
            color: var(--success);
            font-size: 13px;
        }

        .result-actions {
            display: flex;
            gap: 10px;
        }

        .result-actions button {
            margin: 0;
            padding: 10px 18px;
            font-size: 13px;
        }

        /* ===================== РУЛЕТКА ===================== */

        .roulette-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 25px 0;
        }

        .pointer {
            position: absolute;
            z-index: 10;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: var(--accent);
            box-shadow: 0 0 10px rgba(251,188,4,.6);
        }

        .items {
            display: flex;
            gap: 12px;
            transform: translateX(0);
            will-change: transform;
        }

        .item {
            flex: 0 0 120px;
            height: 150px;
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            user-select: none;
            background: var(--surface-2);
        }

        /* Редкость — фон в зависимости от процента выпадения */
        .rarity-common     { background: linear-gradient(160deg, #2A2B2E, #35363A); }
        .rarity-uncommon   { background: linear-gradient(160deg, #17324A, #1E4467); border-color: #4A90D9; }
        .rarity-rare       { background: linear-gradient(160deg, #331B57, #4A2A7A); border-color: #A374E0; }
        .rarity-legendary  { background: linear-gradient(160deg, #4A3405, #7A5708); border-color: var(--accent); }
        .rarity-mythical   { background: linear-gradient(160deg, #4A0E17, #7A1424); border-color: #E0304A;
                              box-shadow: 0 0 14px rgba(224,48,74,.35); }

        .item img {
            width: 85px;
            height: 85px;
            object-fit: contain;
        }

        .item-name {
            font-size: 14px;
            color: var(--text);
            max-width: 105px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        button {
            margin-top: 30px;
            padding: 12px 32px;
            border: none;
            border-radius: 24px;
            background: var(--accent);
            color: var(--accent-ink);
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: .15s;
            box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.15);
        }

        button:hover {
            background: var(--accent-hover);
            box-shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 8px rgba(0,0,0,.2);
        }

        button:active { box-shadow: 0 1px 2px rgba(0,0,0,.3); }
        button:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

        #result {
            margin-top: 25px;
            min-height: 30px;
            font-size: 20px;
            font-weight: 500;
        }

        .loading { color: var(--text-secondary); }

        @media (max-width: 900px) {
            .online-sidebar { display: none; }
        }
    </style>
</head>

<body>

<!-- ===================== TURNSTILE ГЕЙТ ===================== -->
<div id="turnstileOverlay">
    <h2>Проверка перед входом</h2>
    <p>Подтвердите, что вы не робот</p>

    <div class="cf-turnstile"
         data-sitekey="0x4AAAAAAEyoRybxXYtoTAtX"
         data-theme="dark"
         data-callback="onTurnstileSuccess"
         data-error-callback="onTurnstileError">
    </div>

    <div id="turnstileError"></div>
</div>

<!-- ===================== AUTH BAR ===================== -->
<div class="auth-bar" id="authBar"></div>

<div id="goOfflineLink">Перед выходом с сайта нажмите сюда</div>

<!-- ===================== МОДАЛКА ВХОДА/РЕГИСТРАЦИИ ===================== -->
<div class="modal-overlay" id="authModalOverlay">
    <div class="modal">
        <button class="close-x" id="closeModalBtn">×</button>
        <h2 id="authModalTitle">Вход</h2>

        <label for="authUsername">Логин</label>
        <input type="text" id="authUsername" autocomplete="username" placeholder="Ваш логин">

        <label for="authPassword">Пароль</label>
        <input type="password" id="authPassword" autocomplete="current-password" placeholder="Пароль">

        <div class="auth-error" id="authError"></div>

        <div class="modal-actions">
            <button class="switch-link" id="switchModeBtn">Нет аккаунта? Регистрация</button>
            <button id="authSubmitBtn">Войти</button>
        </div>
    </div>
</div>

<!-- ===================== МОДАЛКА ПРОФИЛЯ ===================== -->
<div class="modal-overlay" id="profileModalOverlay">
    <div class="modal wide">
        <button class="close-x" id="closeProfileBtn">×</button>

        <div class="profile-header">
            <div class="profile-avatar" id="profileAvatar">?</div>
            <div class="profile-name-row">
                <div class="pname" id="profileName">—</div>
                <div class="pbalance" id="profileBalance"></div>
            </div>
        </div>

        <div class="profile-description-row" id="profileDescriptionRow">
            <div class="profile-description-text" id="profileDescriptionText"></div>
            <button class="edit-pencil" id="editDescriptionBtn" title="Редактировать описание">✎</button>
        </div>

        <div class="profile-description-edit" id="profileDescriptionEdit" style="display:none;">
            <textarea id="profileDescriptionInput" maxlength="300" placeholder="Немного о себе..."></textarea>
            <div class="modal-actions">
                <button class="switch-link" id="cancelDescriptionBtn">Отмена</button>
                <button id="saveDescriptionBtn">Сохранить</button>
            </div>
        </div>

        <div class="inventory-title">Инвентарь</div>
        <div class="inventory-grid" id="inventoryGrid"></div>
    </div>
</div>

<div class="layout" id="layoutWrapper" style="display:none;">

    <!-- ===================== ONLINE SIDEBAR ===================== -->
    <div class="online-sidebar" id="onlineSidebar">
        <h3>Сейчас на сайте</h3>
        <div id="onlineList"><div class="online-empty">Загрузка...</div></div>
    </div>

    <div class="container" id="appContent">

        <h1>Рулетка</h1>

        <div class="roulette-wrapper">
            <div class="pointer"></div>
            <div class="items" id="items">
                <div class="loading">Загрузка предметов...</div>
            </div>
        </div>

        <button id="spinButton" disabled>Крутить (10)</button>

        <div id="result"></div>

        <div class="result-slot" id="resultSlot">
            <div class="result-info">
                <img id="resultImg" src="" alt="">
                <div>
                    <div class="result-name" id="resultName"></div>
                    <div class="result-price" id="resultPrice"></div>
                </div>
            </div>
            <div class="result-actions">
                <button class="btn-secondary" id="sellResultBtn">Продать</button>
                <button id="keepResultBtn">В инвентарь</button>
            </div>
        </div>

    </div>

</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>

/*
    ==========================================
    НАСТРОЙКИ
    ==========================================
*/

const GITHUB_USER = "t1kodiai-bit";
const GITHUB_REPOSITORY = "DuckDrop";
const TEXTURES_FOLDER = "Textures";

const WORKER_URL = "https://duckdrop-auth.t1kodiai.workers.dev";

const SPIN_COST = 10;


/*
    ==========================================
    ЭЛЕМЕНТЫ
    ==========================================
*/

const itemsContainer = document.getElementById("items");
const spinButton = document.getElementById("spinButton");
const result = document.getElementById("result");

const authBar = document.getElementById("authBar");
const authModalOverlay = document.getElementById("authModalOverlay");
const authModalTitle = document.getElementById("authModalTitle");
const authUsername = document.getElementById("authUsername");
const authPassword = document.getElementById("authPassword");
const authError = document.getElementById("authError");
const authSubmitBtn = document.getElementById("authSubmitBtn");
const switchModeBtn = document.getElementById("switchModeBtn");
const closeModalBtn = document.getElementById("closeModalBtn");

const profileModalOverlay = document.getElementById("profileModalOverlay");
const closeProfileBtn = document.getElementById("closeProfileBtn");
const profileAvatar = document.getElementById("profileAvatar");
const profileName = document.getElementById("profileName");
const profileBalance = document.getElementById("profileBalance");
const profileDescriptionRow = document.getElementById("profileDescriptionRow");
const profileDescriptionText = document.getElementById("profileDescriptionText");
const editDescriptionBtn = document.getElementById("editDescriptionBtn");
const profileDescriptionEdit = document.getElementById("profileDescriptionEdit");
const profileDescriptionInput = document.getElementById("profileDescriptionInput");
const cancelDescriptionBtn = document.getElementById("cancelDescriptionBtn");
const saveDescriptionBtn = document.getElementById("saveDescriptionBtn");
const inventoryGrid = document.getElementById("inventoryGrid");

const resultSlot = document.getElementById("resultSlot");
const resultImg = document.getElementById("resultImg");
const resultName = document.getElementById("resultName");
const resultPrice = document.getElementById("resultPrice");
const sellResultBtn = document.getElementById("sellResultBtn");
const keepResultBtn = document.getElementById("keepResultBtn");

const onlineList = document.getElementById("onlineList");


let items = [];       // {name, price, percent, url}
let spinning = false;

let authMode = "login";
let currentUser = null;  // { username, balance, token }
let viewingProfileUsername = null; // чей профиль сейчас открыт

let pendingWin = null; // текущий невыбранный результат (продать/забрать)

let onlineTimer = null;


/*
    ==========================================
    УТИЛИТЫ
    ==========================================
*/

function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
}

// Название файла: Имя-Цена-Процент.gif
function parseItemFile(file) {
    const base = file.name.replace(/\.gif$/i, "");
    const parts = base.split("-");

    if (parts.length < 3) {
        return { name: base, price: 0, percent: 1, url: file.download_url };
    }

    const percent = parseFloat(parts.pop().replace(",", "."));
    const price = parseFloat(parts.pop().replace(",", "."));
    const name = parts.join("-");

    return {
        name,
        price: isNaN(price) ? 0 : price,
        percent: (isNaN(percent) || percent <= 0) ? 0.01 : percent,
        url: file.download_url,
    };
}

function rarityClass(percent) {
    if (percent <= 1) return "rarity-mythical";
    if (percent <= 5) return "rarity-legendary";
    if (percent <= 15) return "rarity-rare";
    if (percent <= 35) return "rarity-uncommon";
    return "rarity-common";
}

function weightedRandomIndex(list) {
    const weights = list.map((it) => Math.max(0.0001, Number(it.percent) || 0.0001));
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < weights.length; i++) {
        r -= weights[i];
        if (r <= 0) return i;
    }
    return list.length - 1;
}


/*
    ==========================================
    TURNSTILE (гейт перед страницей)
    ==========================================
*/

async function onTurnstileSuccess(token) {

    const errorBox = document.getElementById("turnstileError");
    errorBox.textContent = "Проверяем...";

    try {

        const response = await fetch(WORKER_URL + "/api/verify-turnstile", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token }),
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            errorBox.textContent = "Проверка не пройдена, попробуйте ещё раз";
            if (window.turnstile) window.turnstile.reset();
            return;
        }

        document.getElementById("turnstileOverlay").classList.add("hidden");
        document.getElementById("layoutWrapper").style.display = "block";

        loadSession();
        loadTextures();
        startOnlinePolling();

    } catch (error) {
        console.error(error);
        errorBox.textContent = "Не удалось связаться с сервером";
    }
}

function onTurnstileError() {
    document.getElementById("turnstileError").textContent =
        "Ошибка загрузки проверки, обновите страницу";
}


/*
    ==========================================
    АВТОРИЗАЦИЯ
    ==========================================
*/

function loadSession() {
    const saved = localStorage.getItem("duckdrop_user");
    if (saved) {
        try {
            currentUser = JSON.parse(saved);
        } catch (e) {
            currentUser = null;
        }
    }
    renderAuthBar();
    if (currentUser) markOnline();
}

async function markOnline() {
    if (!currentUser) return;
    try {
        const response = await fetch(WORKER_URL + "/api/online/enter", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: currentUser.token }),
        });
        const data = await response.json();

        if (!response.ok || !data.success) {
            // Сессия могла истечь (например, после долгого перерыва) — просто разлогиниваем
            currentUser = null;
            saveSession();
            renderAuthBar();
            return;
        }

        currentUser.balance = data.user.balance;
        saveSession();
        renderAuthBar();

    } catch (error) {
        console.error(error);
    }
}

function markOffline() {
    if (!currentUser) return;
    // sendBeacon работает даже когда вкладка уже закрывается
    const payload = JSON.stringify({ token: currentUser.token });
    const blob = new Blob([payload], { type: "application/json" });
    navigator.sendBeacon(WORKER_URL + "/api/online/leave", blob);
}

window.addEventListener("pagehide", markOffline);
window.addEventListener("beforeunload", markOffline);

const goOfflineLink = document.getElementById("goOfflineLink");

goOfflineLink.addEventListener("click", async () => {
    if (!currentUser) {
        goOfflineLink.textContent = "Вы не вошли в аккаунт";
        return;
    }

    goOfflineLink.textContent = "Отмечаем офлайн...";

    try {
        const response = await fetch(WORKER_URL + "/api/online/leave", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: currentUser.token }),
        });

        const data = await response.json();

        if (response.ok && data.success) {
            goOfflineLink.textContent = "Готово, теперь можно закрывать вкладку";
        } else {
            goOfflineLink.textContent = "Не получилось, попробуйте ещё раз";
        }

    } catch (error) {
        console.error(error);
        goOfflineLink.textContent = "Ошибка соединения, попробуйте ещё раз";
    }

    setTimeout(() => {
        goOfflineLink.textContent = "Перед выходом с сайта нажмите сюда";
    }, 4000);
});

function saveSession() {
    if (currentUser) {
        localStorage.setItem("duckdrop_user", JSON.stringify(currentUser));
    } else {
        localStorage.removeItem("duckdrop_user");
    }
}

function renderAuthBar() {
    authBar.innerHTML = "";

    if (currentUser) {
        const chip = document.createElement("div");
        chip.className = "user-chip";
        chip.innerHTML = `
            <span>${escapeHtml(currentUser.username)}</span>
            <span class="balance">${currentUser.balance ?? 0}₽</span>
        `;
        chip.addEventListener("click", () => openProfileModal(currentUser.username));

        const logoutBtn = document.createElement("button");
        logoutBtn.className = "btn-secondary";
        logoutBtn.textContent = "Выйти";
        logoutBtn.addEventListener("click", () => {
            markOffline();
            currentUser = null;
            saveSession();
            renderAuthBar();
        });

        authBar.appendChild(chip);
        authBar.appendChild(logoutBtn);
    } else {
        const loginBtn = document.createElement("button");
        loginBtn.className = "btn-secondary";
        loginBtn.textContent = "Войти";
        loginBtn.addEventListener("click", () => openAuthModal("login"));

        const registerBtn = document.createElement("button");
        registerBtn.textContent = "Регистрация";
        registerBtn.addEventListener("click", () => openAuthModal("register"));

        authBar.appendChild(loginBtn);
        authBar.appendChild(registerBtn);
    }
}

function openAuthModal(mode) {
    authMode = mode;
    authError.textContent = "";
    authUsername.value = "";
    authPassword.value = "";
    updateModalTexts();
    authModalOverlay.classList.add("open");
    authUsername.focus();
}

function closeAuthModal() {
    authModalOverlay.classList.remove("open");
}

function updateModalTexts() {
    if (authMode === "login") {
        authModalTitle.textContent = "Вход";
        authSubmitBtn.textContent = "Войти";
        switchModeBtn.textContent = "Нет аккаунта? Регистрация";
    } else {
        authModalTitle.textContent = "Регистрация";
        authSubmitBtn.textContent = "Создать аккаунт";
        switchModeBtn.textContent = "Уже есть аккаунт? Войти";
    }
}

switchModeBtn.addEventListener("click", () => {
    authMode = authMode === "login" ? "register" : "login";
    authError.textContent = "";
    updateModalTexts();
});

closeModalBtn.addEventListener("click", closeAuthModal);

authModalOverlay.addEventListener("click", (e) => {
    if (e.target === authModalOverlay) closeAuthModal();
});

authSubmitBtn.addEventListener("click", submitAuthForm);

async function submitAuthForm() {

    const username = authUsername.value.trim();
    const password = authPassword.value;

    authError.textContent = "";

    if (!username || !password) {
        authError.textContent = "Заполните оба поля";
        return;
    }

    authSubmitBtn.disabled = true;
    authSubmitBtn.textContent = "Подождите...";

    try {

        const endpoint = authMode === "login" ? "/api/login" : "/api/register";

        const response = await fetch(WORKER_URL + endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
        });

        const data = await response.json();

        if (!response.ok || data.error) {
            authError.textContent = data.error || "Что-то пошло не так";
            return;
        }

        currentUser = {
            username: data.user.username,
            balance: data.user.balance,
            token: data.token,
        };

        saveSession();
        renderAuthBar();
        closeAuthModal();
        refreshOnlineList();

    } catch (error) {
        console.error(error);
        authError.textContent = "Не удалось связаться с сервером";
    } finally {
        authSubmitBtn.disabled = false;
        updateModalTexts();
    }
}


/*
    ==========================================
    ПРОФИЛЬ
    ==========================================
*/

async function openProfileModal(username) {
    viewingProfileUsername = username;

    profileName.textContent = username;
    profileAvatar.textContent = username.charAt(0).toUpperCase();
    profileBalance.textContent = "";
    profileDescriptionText.textContent = "Загрузка...";
    inventoryGrid.innerHTML = "";
    profileDescriptionEdit.style.display = "none";
    profileDescriptionRow.style.display = "flex";

    profileModalOverlay.classList.add("open");

    try {
        const response = await fetch(
            `${WORKER_URL}/api/profile?username=${encodeURIComponent(username)}`
        );
        const data = await response.json();

        if (!response.ok || !data.success) {
            profileDescriptionText.textContent = "Не удалось загрузить профиль";
            return;
        }

        renderProfile(data.user);

    } catch (error) {
        console.error(error);
        profileDescriptionText.textContent = "Ошибка соединения";
    }
}

function renderProfile(user) {
    profileBalance.textContent = `${user.balance}₽`;
    profileDescriptionText.textContent = user.description || "Пока ничего не написано.";

    const isOwner = currentUser && currentUser.username === user.username;
    editDescriptionBtn.style.display = isOwner ? "inline-block" : "none";

    inventoryGrid.innerHTML = "";

    for (let i = 0; i < 20; i++) {
        const slot = document.createElement("div");
        slot.className = "inventory-slot";

        const invItem = user.inventory && user.inventory[i];

        if (invItem) {
            slot.classList.add("filled");
            slot.classList.add(rarityClass(invItem.percent));

            const img = document.createElement("img");
            const found = items.find((it) => it.name === invItem.name);
            img.src = found ? found.url : "";
            img.alt = invItem.name;

            const name = document.createElement("div");
            name.className = "slot-name";
            name.textContent = invItem.name;

            slot.appendChild(img);
            slot.appendChild(name);

            if (isOwner) {
                const removeBtn = document.createElement("div");
                removeBtn.className = "remove-x";
                removeBtn.textContent = "✕";
                slot.appendChild(removeBtn);

                slot.addEventListener("click", () => removeFromInventory(i));
            }
        }

        inventoryGrid.appendChild(slot);
    }
}

async function removeFromInventory(index) {
    if (!currentUser) return;

    try {
        const response = await fetch(WORKER_URL + "/api/inventory/remove", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: currentUser.token, index }),
        });

        const data = await response.json();
        if (!response.ok || !data.success) return;

        openProfileModal(currentUser.username);

    } catch (error) {
        console.error(error);
    }
}

closeProfileBtn.addEventListener("click", () => {
    profileModalOverlay.classList.remove("open");
});

profileModalOverlay.addEventListener("click", (e) => {
    if (e.target === profileModalOverlay) profileModalOverlay.classList.remove("open");
});

editDescriptionBtn.addEventListener("click", () => {
    profileDescriptionInput.value = profileDescriptionText.textContent === "Пока ничего не написано."
        ? ""
        : profileDescriptionText.textContent;
    profileDescriptionRow.style.display = "none";
    profileDescriptionEdit.style.display = "block";
});

cancelDescriptionBtn.addEventListener("click", () => {
    profileDescriptionEdit.style.display = "none";
    profileDescriptionRow.style.display = "flex";
});

saveDescriptionBtn.addEventListener("click", async () => {
    if (!currentUser) return;

    try {
        const response = await fetch(WORKER_URL + "/api/profile/description", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                token: currentUser.token,
                description: profileDescriptionInput.value,
            }),
        });

        const data = await response.json();
        if (!response.ok || !data.success) return;

        profileDescriptionEdit.style.display = "none";
        profileDescriptionRow.style.display = "flex";
        renderProfile(data.user);

    } catch (error) {
        console.error(error);
    }
});


/*
    ==========================================
    ОНЛАЙН-ПОЛЬЗОВАТЕЛИ
    ==========================================
*/

function startOnlinePolling() {
    refreshOnlineList();
    onlineTimer = setInterval(refreshOnlineList, 15000);
}

async function refreshOnlineList() {
    try {
        const response = await fetch(WORKER_URL + "/api/online");
        const data = await response.json();

        if (!response.ok || !data.success) return;

        renderOnlineList(data.usernames || []);

    } catch (error) {
        console.error(error);
    }
}

function renderOnlineList(usernames) {
    onlineList.innerHTML = "";

    if (usernames.length === 0) {
        onlineList.innerHTML = `<div class="online-empty">Сейчас никого нет</div>`;
        return;
    }

    usernames.forEach((name) => {
        const card = document.createElement("div");
        card.className = "online-user-card";
        card.innerHTML = `
            <div class="online-avatar">${escapeHtml(name.charAt(0).toUpperCase())}</div>
            <div class="name">${escapeHtml(name)}</div>
        `;
        card.addEventListener("click", () => openProfileModal(name));
        onlineList.appendChild(card);
    });
}


/*
    ==========================================
    ПОЛУЧЕНИЕ GIF ИЗ GITHUB
    ==========================================
*/

async function loadTextures() {

    try {

        const apiURL =
            `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPOSITORY}/contents/${TEXTURES_FOLDER}`;

        const response = await fetch(apiURL);

        if (!response.ok) {
            throw new Error(`GitHub API error: ${response.status}`);
        }

        const files = await response.json();

        const gifFiles = files.filter(file =>
            file.type === "file" &&
            file.name.toLowerCase().endsWith(".gif")
        );

        if (gifFiles.length === 0) {
            throw new Error("В папке Textures нет GIF файлов.");
        }

        items = gifFiles.map(parseItemFile);

        shuffle(items);

        renderRoulette();

        spinButton.disabled = false;

    } catch (error) {

        console.error(error);

        itemsContainer.innerHTML = `
            <div style="width:100%;padding:30px;color:#ff5555;">
                Не удалось загрузить предметы
            </div>
        `;

        result.textContent = error.message;
    }
}


/*
    ==========================================
    ПЕРЕМЕШИВАНИЕ
    ==========================================
*/

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}


/*
    ==========================================
    СОЗДАНИЕ РУЛЕТКИ
    ==========================================
*/

function renderRoulette() {

    itemsContainer.innerHTML = "";

    const rouletteItems = [];

    for (let i = 0; i < 8; i++) {
        items.forEach(item => rouletteItems.push(item));
    }

    rouletteItems.forEach(item => {

        const element = document.createElement("div");
        element.className = "item " + rarityClass(item.percent);

        const image = document.createElement("img");
        image.src = item.url;
        image.alt = item.name;

        const name = document.createElement("div");
        name.className = "item-name";
        name.textContent = item.name;

        element.appendChild(image);
        element.appendChild(name);

        itemsContainer.appendChild(element);
    });
}


/*
    ==========================================
    КРУТКА
    ==========================================
*/

async function spin() {

    if (spinning || items.length === 0) return;

    if (!currentUser) {
        openAuthModal("login");
        return;
    }

    if ((currentUser.balance ?? 0) < SPIN_COST) {
        result.textContent = "Недостаточно средств";
        return;
    }

    spinning = true;
    spinButton.disabled = true;
    result.textContent = "";
    resultSlot.classList.remove("visible");
    pendingWin = null;

    // Списываем стоимость прокрута на сервере
    try {
        const response = await fetch(WORKER_URL + "/api/spin", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: currentUser.token }),
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            result.textContent = data.error || "Не удалось списать средства";
            spinning = false;
            spinButton.disabled = false;
            return;
        }

        currentUser.balance = data.balance;
        saveSession();
        renderAuthBar();

    } catch (error) {
        console.error(error);
        result.textContent = "Ошибка соединения с сервером";
        spinning = false;
        spinButton.disabled = false;
        return;
    }

    // Выбираем победителя (взвешенно по проценту редкости)
    const winnerIndex = weightedRandomIndex(items);

    itemsContainer.style.transition = "none";
    itemsContainer.style.transform = "translateX(0px)";

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {

            const rounds = 5;
            const actualIndex = rounds * items.length + winnerIndex;
            const elements = itemsContainer.children;
            const winner = elements[actualIndex];

            if (!winner) {
                spinning = false;
                spinButton.disabled = false;
                return;
            }

            const containerCenter =
                document.querySelector(".roulette-wrapper").offsetWidth / 2;
            const itemCenter = winner.offsetLeft + winner.offsetWidth / 2;
            const randomOffset = (Math.random() - 0.5) * 20;
            const target = containerCenter - itemCenter + randomOffset;

            itemsContainer.style.transition = "transform 5s cubic-bezier(.12,.75,.15,1)";
            itemsContainer.style.transform = `translateX(${target}px)`;

            setTimeout(() => {

                const won = items[winnerIndex];
                result.textContent = `Выпало: ${won.name}`;

                showResultSlot(won);

                spinning = false;
                spinButton.disabled = false;

            }, 5100);
        });
    });
}


/*
    ==========================================
    РЕЗУЛЬТАТ ПРОКРУТА (продать / в инвентарь)
    ==========================================
*/

function showResultSlot(item) {
    pendingWin = item;

    resultImg.src = item.url;
    resultName.textContent = item.name;
    resultPrice.textContent = `${item.price}₽`;

    resultSlot.classList.add("visible");
}

sellResultBtn.addEventListener("click", async () => {
    if (!pendingWin || !currentUser) return;

    sellResultBtn.disabled = true;

    try {
        const response = await fetch(WORKER_URL + "/api/inventory/sell", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: currentUser.token, item: pendingWin }),
        });

        const data = await response.json();

        if (response.ok && data.success) {
            currentUser.balance = data.balance;
            saveSession();
            renderAuthBar();
            resultSlot.classList.remove("visible");
            pendingWin = null;
        }

    } catch (error) {
        console.error(error);
    } finally {
        sellResultBtn.disabled = false;
    }
});

keepResultBtn.addEventListener("click", async () => {
    if (!pendingWin || !currentUser) return;

    keepResultBtn.disabled = true;

    try {
        const response = await fetch(WORKER_URL + "/api/inventory/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: currentUser.token, item: pendingWin }),
        });

        const data = await response.json();

        if (response.ok && data.success) {
            resultSlot.classList.remove("visible");
            pendingWin = null;
        } else {
            result.textContent = data.error || "Не удалось положить в инвентарь";
        }

    } catch (error) {
        console.error(error);
    } finally {
        keepResultBtn.disabled = false;
    }
});


/*
    ==========================================
    КНОПКА
    ==========================================
*/

spinButton.addEventListener("click", spin);

</script>
