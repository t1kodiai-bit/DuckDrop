<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Рулетка</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 900px;
            max-width: 95%;
            text-align: center;
            position: relative;
        }

        h1 {
            margin-bottom: 35px;
            font-size: 42px;
        }

        /* ===================== AUTH UI ===================== */

        .auth-bar {
            position: fixed;
            top: 20px;
            right: 25px;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 100;
        }

        .auth-bar button {
            margin: 0;
            padding: 10px 20px;
            font-size: 14px;
        }

        .btn-secondary {
            background: transparent !important;
            color: white !important;
            border: 1px solid #333 !important;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #161616;
            border: 1px solid #292929;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 14px;
        }

        .user-chip .balance {
            color: #7CFC90;
            font-weight: bold;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.75);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: #131313;
            border: 1px solid #292929;
            border-radius: 16px;
            padding: 30px;
            width: 340px;
            max-width: 90%;
            text-align: left;
        }

        .modal h2 {
            margin: 0 0 20px;
            font-size: 22px;
        }

        .modal label {
            display: block;
            font-size: 13px;
            color: #999;
            margin: 14px 0 6px;
        }

        .modal input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #2c2c2c;
            background: #0d0d0d;
            color: white;
            font-size: 14px;
        }

        .modal input:focus {
            outline: none;
            border-color: #555;
        }

        .modal .modal-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 22px;
        }

        .modal .modal-actions button {
            margin: 0;
            padding: 10px 22px;
            font-size: 14px;
        }

        .modal .switch-link {
            background: none;
            color: #888;
            border: none;
            font-size: 13px;
            padding: 0;
            text-decoration: underline;
            cursor: pointer;
        }

        .modal .close-x {
            position: absolute;
            top: 14px;
            right: 16px;
            background: none;
            color: #888;
            border: none;
            font-size: 20px;
            padding: 4px 8px;
            margin: 0;
        }

        .modal {
            position: relative;
        }

        .auth-error {
            color: #ff5f5f;
            font-size: 13px;
            margin-top: 12px;
            min-height: 16px;
        }

        /* ===================== РУЛЕТКА (как было) ===================== */

        .roulette-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 18px;
            background: #111;
            border: 1px solid #252525;
            padding: 25px 0;
        }

        .pointer {
            position: absolute;
            z-index: 10;

            top: 0;
            left: 50%;

            transform: translateX(-50%);

            width: 4px;
            height: 100%;

            background: white;

            box-shadow:
                0 0 10px rgba(255,255,255,.8);
        }

        .items {
            display: flex;
            gap: 12px;

            transform: translateX(0);

            will-change: transform;
        }

        .item {
            flex: 0 0 120px;

            height: 150px;

            background: #191919;
            border: 1px solid #292929;

            border-radius: 14px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            gap: 10px;

            user-select: none;
        }

        .item img {
            width: 85px;
            height: 85px;

            object-fit: contain;
        }

        .item-name {
            font-size: 14px;
            color: #ddd;

            max-width: 105px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        button {
            margin-top: 30px;

            padding: 14px 45px;

            border: none;
            border-radius: 12px;

            background: white;
            color: black;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: .2s;
        }

        button:hover {
            transform: scale(1.04);
        }

        button:active {
            transform: scale(.97);
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        #result {
            margin-top: 25px;

            min-height: 30px;

            font-size: 22px;
            font-weight: bold;
        }

        .loading {
            color: #888;
        }
    </style>
</head>

<body>

<!-- ===================== AUTH BAR ===================== -->
<div class="auth-bar" id="authBar">
    <!-- Заполняется скриптом: либо кнопки Войти/Регистрация, либо чип пользователя -->
</div>

<!-- ===================== МОДАЛКА ВХОДА/РЕГИСТРАЦИИ ===================== -->
<div class="modal-overlay" id="authModalOverlay">
    <div class="modal">
        <button class="close-x" id="closeModalBtn">×</button>
        <h2 id="authModalTitle">Вход</h2>

        <label for="authUsername">Логин</label>
        <input type="text" id="authUsername" autocomplete="username" placeholder="Ваш логин">

        <label for="authPassword">Пароль</label>
        <input type="password" id="authPassword" autocomplete="current-password" placeholder="Пароль">

        <div class="auth-error" id="authError"></div>

        <div class="modal-actions">
            <button class="switch-link" id="switchModeBtn">Нет аккаунта? Регистрация</button>
            <button id="authSubmitBtn">Войти</button>
        </div>
    </div>
</div>

<div class="container">

    <h1>Рулетка</h1>

    <div class="roulette-wrapper">
        <div class="pointer"></div>

        <div class="items" id="items">
            <div class="loading">Загрузка предметов...</div>
        </div>
    </div>

    <button id="spinButton" disabled>
        Крутить
    </button>

    <div id="result"></div>

</div>

<script>

/*
    ==========================================
    НАСТРОЙКИ
    ==========================================
*/

const GITHUB_USER = "t1kodiai-bit";
const GITHUB_REPOSITORY = "DuckDrop";

const TEXTURES_FOLDER = "Textures";

// Адрес вашего задеплоенного Cloudflare Worker.
// Замените на реальный после деплоя, например:
// "https://duckdrop-auth.ВАШ_САБДОМЕН.workers.dev"
const WORKER_URL = "https://duckdrop-auth.t1kodiai.workers.dev";


/*
    ==========================================
    ЭЛЕМЕНТЫ
    ==========================================
*/

const itemsContainer = document.getElementById("items");
const spinButton = document.getElementById("spinButton");
const result = document.getElementById("result");

const authBar = document.getElementById("authBar");
const authModalOverlay = document.getElementById("authModalOverlay");
const authModalTitle = document.getElementById("authModalTitle");
const authUsername = document.getElementById("authUsername");
const authPassword = document.getElementById("authPassword");
const authError = document.getElementById("authError");
const authSubmitBtn = document.getElementById("authSubmitBtn");
const switchModeBtn = document.getElementById("switchModeBtn");
const closeModalBtn = document.getElementById("closeModalBtn");


let items = [];
let spinning = false;

let authMode = "login"; // "login" | "register"
let currentUser = null; // { username, balance } — только для отображения в браузере


/*
    ==========================================
    АВТОРИЗАЦИЯ
    ==========================================
*/

function loadSession() {
    const saved = localStorage.getItem("duckdrop_user");
    if (saved) {
        try {
            currentUser = JSON.parse(saved);
        } catch (e) {
            currentUser = null;
        }
    }
    renderAuthBar();
}

function saveSession() {
    if (currentUser) {
        localStorage.setItem("duckdrop_user", JSON.stringify(currentUser));
    } else {
        localStorage.removeItem("duckdrop_user");
    }
}

function renderAuthBar() {
    authBar.innerHTML = "";

    if (currentUser) {
        const chip = document.createElement("div");
        chip.className = "user-chip";
        chip.innerHTML = `
            <span>${escapeHtml(currentUser.username)}</span>
            <span class="balance">${currentUser.balance ?? 0}₽</span>
        `;

        const logoutBtn = document.createElement("button");
        logoutBtn.className = "btn-secondary";
        logoutBtn.textContent = "Выйти";
        logoutBtn.addEventListener("click", () => {
            currentUser = null;
            saveSession();
            renderAuthBar();
        });

        authBar.appendChild(chip);
        authBar.appendChild(logoutBtn);
    } else {
        const loginBtn = document.createElement("button");
        loginBtn.className = "btn-secondary";
        loginBtn.textContent = "Войти";
        loginBtn.addEventListener("click", () => openAuthModal("login"));

        const registerBtn = document.createElement("button");
        registerBtn.textContent = "Регистрация";
        registerBtn.addEventListener("click", () => openAuthModal("register"));

        authBar.appendChild(loginBtn);
        authBar.appendChild(registerBtn);
    }
}

function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
}

function openAuthModal(mode) {
    authMode = mode;
    authError.textContent = "";
    authUsername.value = "";
    authPassword.value = "";
    updateModalTexts();
    authModalOverlay.classList.add("open");
    authUsername.focus();
}

function closeAuthModal() {
    authModalOverlay.classList.remove("open");
}

function updateModalTexts() {
    if (authMode === "login") {
        authModalTitle.textContent = "Вход";
        authSubmitBtn.textContent = "Войти";
        switchModeBtn.textContent = "Нет аккаунта? Регистрация";
    } else {
        authModalTitle.textContent = "Регистрация";
        authSubmitBtn.textContent = "Создать аккаунт";
        switchModeBtn.textContent = "Уже есть аккаунт? Войти";
    }
}

switchModeBtn.addEventListener("click", () => {
    authMode = authMode === "login" ? "register" : "login";
    authError.textContent = "";
    updateModalTexts();
});

closeModalBtn.addEventListener("click", closeAuthModal);

authModalOverlay.addEventListener("click", (e) => {
    if (e.target === authModalOverlay) {
        closeAuthModal();
    }
});

authSubmitBtn.addEventListener("click", submitAuthForm);

async function submitAuthForm() {

    const username = authUsername.value.trim();
    const password = authPassword.value;

    authError.textContent = "";

    if (!username || !password) {
        authError.textContent = "Заполните оба поля";
        return;
    }

    if (WORKER_URL.includes("ЗАМЕНИТЕ")) {
        authError.textContent = "Сначала укажите адрес Worker'а в коде (WORKER_URL)";
        return;
    }

    authSubmitBtn.disabled = true;
    authSubmitBtn.textContent = "Подождите...";

    try {

        const endpoint = authMode === "login" ? "/api/login" : "/api/register";

        const response = await fetch(WORKER_URL + endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
        });

        const data = await response.json();

        if (!response.ok || data.error) {
            authError.textContent = data.error || "Что-то пошло не так";
            return;
        }

        currentUser = data.user;
        saveSession();
        renderAuthBar();
        closeAuthModal();

    } catch (error) {
        console.error(error);
        authError.textContent = "Не удалось связаться с сервером";
    } finally {
        authSubmitBtn.disabled = false;
        updateModalTexts();
    }
}


/*
    ==========================================
    ПОЛУЧЕНИЕ GIF ИЗ GITHUB
    ==========================================
*/

async function loadTextures() {

    try {

        const apiURL =
            `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPOSITORY}/contents/${TEXTURES_FOLDER}`;

        const response = await fetch(apiURL);

        if (!response.ok) {
            throw new Error(
                `GitHub API error: ${response.status}`
            );
        }

        const files = await response.json();

        const gifFiles = files.filter(file =>
            file.type === "file" &&
            file.name.toLowerCase().endsWith(".gif")
        );

        if (gifFiles.length === 0) {
            throw new Error("В папке Textures нет GIF файлов.");
        }

        items = gifFiles.map(file => {

            const name = file.name
                .replace(/\.gif$/i, "");

            return {
                name: name,
                url: file.download_url
            };

        });

        shuffle(items);

        renderRoulette();

        spinButton.disabled = false;

    } catch (error) {

        console.error(error);

        itemsContainer.innerHTML = `
            <div style="
                width:100%;
                padding:30px;
                color:#ff5555;
            ">
                Не удалось загрузить предметы
            </div>
        `;

        result.textContent = error.message;
    }
}


/*
    ==========================================
    ПЕРЕМЕШИВАНИЕ
    ==========================================
*/

function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] =
        [array[j], array[i]];
    }

}


/*
    ==========================================
    СОЗДАНИЕ РУЛЕТКИ
    ==========================================
*/

function renderRoulette() {

    itemsContainer.innerHTML = "";

    const rouletteItems = [];

    for (let i = 0; i < 8; i++) {

        items.forEach(item => {

            rouletteItems.push(item);

        });

    }

    rouletteItems.forEach(item => {

        const element = document.createElement("div");

        element.className = "item";

        const image = document.createElement("img");

        image.src = item.url;

        image.alt = item.name;

        const name = document.createElement("div");

        name.className = "item-name";

        name.textContent = item.name;

        element.appendChild(image);
        element.appendChild(name);

        itemsContainer.appendChild(element);

    });

}


/*
    ==========================================
    КРУТКА
    ==========================================
*/

function spin() {

    if (spinning || items.length === 0)
        return;

    spinning = true;

    spinButton.disabled = true;

    result.textContent = "";

    itemsContainer.style.transition = "none";

    itemsContainer.style.transform =
        "translateX(0px)";

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            const winnerIndex =
                Math.floor(Math.random() * items.length);

            const rounds = 5;

            const actualIndex =
                rounds * items.length + winnerIndex;

            const elements =
                itemsContainer.children;

            const winner =
                elements[actualIndex];

            if (!winner) {

                spinning = false;
                spinButton.disabled = false;

                return;
            }

            const containerCenter =
                document.querySelector(".roulette-wrapper")
                .offsetWidth / 2;

            const itemCenter =
                winner.offsetLeft +
                winner.offsetWidth / 2;

            const randomOffset =
                (Math.random() - 0.5) * 20;

            const target =
                containerCenter -
                itemCenter +
                randomOffset;

            itemsContainer.style.transition =
                "transform 5s cubic-bezier(.12,.75,.15,1)";

            itemsContainer.style.transform =
                `translateX(${target}px)`;

            setTimeout(() => {

                result.textContent =
                    `Выпало: ${items[winnerIndex].name}`;

                spinning = false;

                spinButton.disabled = false;

            }, 5100);

        });

    });

}


/*
    ==========================================
    КНОПКА
    ==========================================
*/

spinButton.addEventListener("click", spin);


/*
    ==========================================
    ЗАПУСК
    ==========================================
*/

loadSession();
loadTextures();

</script>

</body>
</html>
